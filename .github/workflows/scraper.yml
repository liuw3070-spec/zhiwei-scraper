name: Amazon BSR 采集

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 北京时间凌晨 2 点（默认抓 Pet Water Fountain）
  workflow_dispatch:
    inputs:
      category:
        description: '目标品类（任意大小写/中文/英文/别名，会从 category_catalog.json 解析）。留空则按 DEFAULT_CONFIG 抓取。'
        required: false
        default: ''
        type: string
      max_products:
        description: '最大产品数（覆盖 DEFAULT_CONFIG.max_products，留空则用默认 10）'
        required: false
        default: ''
        type: string

concurrency:
  group: scraper-push
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright greenlet requests
          python -m playwright install chromium --with-deps

      - name: Run scraper
        env:
          CI: "true"
          SCRAPE_CATEGORY: ${{ github.event.inputs.category }}
        run: |
          cd scraper
          ARGS=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            ARGS="$ARGS --category \"${{ github.event.inputs.category }}\""
          fi
          if [ -n "${{ github.event.inputs.max_products }}" ]; then
            ARGS="$ARGS --max-products ${{ github.event.inputs.max_products }}"
          fi
          eval "python amazon_bsr_scraper.py $ARGS"

      - name: Update manifest
        run: |
          cd scraper
          python update_manifest.py

      - name: Upload to Dify
        env:
          DIFY_DATASET_API_KEY: ${{ secrets.DIFY_DATASET_API_KEY }}
        run: |
          cd scraper
          python upload_to_dify.py
        continue-on-error: true

      - name: Commit and push output (self-healing)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CAT_TAG="${{ github.event.inputs.category }}"
          if [ -z "$CAT_TAG" ]; then CAT_TAG="default"; fi

          for attempt in 1 2 3 4 5; do
            echo "============ Attempt $attempt ============"

            git add scraper/output/ scraper/category_catalog.json

            if git diff --cached --quiet; then
              echo "[Phase 1] No changes to commit, exiting clean."
              exit 0
            fi

            git commit -m "采集快照: $CAT_TAG @ $(date +%Y-%m-%d) [attempt $attempt]"

            # 拉取远程更新，manifest.json 冲突时用本地（待重新生成）
            if ! git pull --rebase -X theirs origin master 2>&1; then
              echo "[Phase 2] Rebase failed, aborting and retrying..."
              git rebase --abort 2>/dev/null || true
              git reset --soft HEAD~1 2>/dev/null || true
              sleep $((attempt * 3))
              continue
            fi

            # 重新生成 manifest，确保反映「远程已有快照 + 本次新增快照」的全集
            cd scraper && python update_manifest.py && cd ..
            if ! git diff --quiet scraper/output/manifest.json; then
              git add scraper/output/manifest.json
              git commit --amend --no-edit
              echo "[Phase 3] Manifest regenerated and amended."
            fi

            if git push origin HEAD:master; then
              echo "[Phase 4] Push success on attempt $attempt"
              exit 0
            fi

            echo "[Phase 4] Push rejected (likely concurrent push), rolling back and retrying..."
            git reset --soft HEAD~1 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo "[FATAL] All 5 attempts failed. Manual intervention required."
          exit 1
