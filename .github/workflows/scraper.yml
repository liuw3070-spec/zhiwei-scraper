name: Amazon BSR 采集

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 北京时间凌晨2点
  workflow_dispatch:        # 手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright greenlet requests
          python -m playwright install chromium --with-deps

      - name: Run scraper
        env:
          CI: "true"
        run: |
          cd scraper
          python amazon_bsr_scraper.py

      - name: Upload to Dify
        env:
          DIFY_DATASET_API_KEY: ${{ secrets.DIFY_DATASET_API_KEY }}
        run: |
          cd scraper
          python upload_to_dify.py

      - name: Commit and push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "采集快照: $(date +%Y-%m-%d)"
            git push origin HEAD:master
          fi
